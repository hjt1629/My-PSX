name: Build

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build -c release
      - name: Find a sample photo for background removal
        run: |
          ls -R "/Library/User Pictures" | head -40 || true
          PHOTO="$(find "/Library/User Pictures" -type f \( -iname '*.heic' -o -iname '*.tif' -o -iname '*.png' -o -iname '*.jpg' \) 2>/dev/null | head -1)"
          echo "Sample photo: $PHOTO"
          echo "PSX_SUBJECT_PHOTO=$PHOTO" >> "$GITHUB_ENV"
      - name: Test
        run: swift test
      - name: Package .app
        run: ./scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MyPSX-app
          path: build/*.app

  ui-smoke:
    # 실제 앱을 띄워 조작하고 스크린샷을 남깁니다.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Package .app
        run: ./scripts/build-app.sh
      - name: Install cliclick
        run: brew install cliclick || true
      - name: Run UI smoke test
        run: ./scripts/ui-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: build/screenshots
